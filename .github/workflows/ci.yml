name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "agent/pyproject.toml"
      - run: pip install -e "./agent[dev]"
      - run: cd agent && ruff check src tests
      - run: cd agent && ruff format --check src tests
      - run: cd agent && pytest -q
