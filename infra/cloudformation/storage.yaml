AWSTemplateFormatVersion: "2010-09-09"
Description: SnapFlick - bucket S3 y tabla de jobs

Parameters:
  BucketName:
    Type: String
    Description: Nombre global unico para el bucket

Resources:
  CatalogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30

  # NOTA: sin usar por el código actual. El estado de los jobs se guarda como
  # un JSON por job en el propio CatalogBucket (jobs/<job_id>.json, ver
  # agent/src/snapflick/job_store.py) en vez de en esta tabla, para no sumar
  # un servicio más al despliegue. Se deja provisionada por si en el futuro
  # el volumen de jobs justifica un índice separado en vez de listar+bajar
  # todo el prefijo jobs/ de S3 (ver CLAUDE.md, "Job persistence").
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: snapflick-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  BucketArn:
    Value: !GetAtt CatalogBucket.Arn
  TableName:
    Value: !Ref JobsTable
